mode = "dark"

# Desktop / TUI / aether palette. Nvim names in comments; syntax leftovers
# (str, h5, h6, search/diff washes) stay in kimiko.nvim.

accent = "#eaf4a0"                 # fg1bri (locked-in); caret/ring stay cypher; color11 is this paint too
selection = "#004f87"              # bg_vis; alt: bg_add #1b3f00
selection_foreground = "#fcc1d6"   # fg2 (rose on Visual blue); alt: h5 #c7b7ca
muted = "#4e4e52"                  # line; bump candidates: h6 #aaaaab, h5 #c7b7ca, fgc #aad1d1

background = "#1d2121"             # bg2
dark_background = "#0d0f0f"        # bg0
darker_background = "#000000"      # b00
lighter_background = "#2d2929"     # bg3

foreground = "#f8d1aa"             # fg_read (waybar letter)
dark_foreground = "#4e4e52"        # line (same as muted; no nvim grey in the 0.12 band)
light_foreground = "#bad094"       # fg1 (nvim Normal)
bright_foreground = "#d1f85d"      # active / cypher (cursor + color15); color11 stays fg1bri

red = "#f8015d"                    # boom
orange = "#fa9903"                 # warn
yellow = "#f8d15d"                 # kw
green = "#5df85d"                  # good
cyan = "#aad1d1"                   # fgc
blue = "#5f87af"                   # fg4
magenta = "#aa83f8"                # nvim accent
brown = "#4c1100"                  # bg_del

bright_red = "#f85d84"             # op
bright_yellow = "#eaf4a0"          # fg1bri
bright_green = "#b2e878"           # fine
bright_cyan = "#d1f8f8"            # fn
bright_blue = "#8bb2d3"            # fg3
bright_magenta = "#aaaaf8"         # num

hyprland_active_border = "rgba(d1f85dee)"
hyprland_inactive_border = "#2d2929"  # bg3
